<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="60%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="180" fill="#00f0ff" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="500" r="220" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />

  <!-- Grid Accent Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Status / Live Tag -->
  <g transform="translate(100, 100)">
    <rect width="140" height="34" rx="17" fill="#dc2626" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#f87171" letter-spacing="1.5">LIVE WIRE</text>
  </g>

  <!-- Live Pulse Badge -->
  <g transform="translate(255, 100)">
    <rect width="210" height="34" rx="17" fill="#3b82f6" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1" />
    <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="0.8">3-MINUTE AUTO SYNC</text>
  </g>

  <!-- Main Headline Title -->
  <text x="100" y="250" font-family="'Merriweather', Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
    WHAT'S GOING ON
  </text>

  <!-- Accent Underline Bar -->
  <rect x="100" y="275" width="280" height="5" rx="2.5" fill="url(#brandGrad)" />

  <!-- Subtitle & Value Proposition -->
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#94a3b8">
    Real-Time Global News &amp; Intelligence Portal
  </text>
  <text x="100" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b">
    Live updates from The Hindu, ThePrint, The Wire, Livemint, NDTV, NYT, BBC &amp; Google News
  </text>

  <!-- Bottom Badges Bar -->
  <g transform="translate(100, 475)">
    <!-- Domain Tag -->
    <rect width="260" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="30" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#00f0ff">
      🌐 wahtgoinon.online
    </text>

    <!-- India & World Badges -->
    <g transform="translate(280, 0)">
      <rect width="170" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
        🏛️ Indian Politics
      </text>
    </g>

    <g transform="translate(470, 0)">
      <rect width="155" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
        📈 Markets &amp; Tech
      </text>
    </g>

    <g transform="translate(645, 0)">
      <rect width="180" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
        📚 Current Affairs
      </text>
    </g>
  </g>

  <!-- Ambient Border Accent -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#1e293b" stroke-width="2" />
</svg>
